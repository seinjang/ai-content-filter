name: acf

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acf
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acf"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    build: ../server
    command: ["alembic", "upgrade", "head"]
    environment: &server-env
      ACF_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/acf
      ACF_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ../server
    environment: *server-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
