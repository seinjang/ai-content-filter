<!DOCTYPE html>
<!--
  실제 네이버 모바일 블로그(2026-11) 마크업 구조를 그대로 따른 fixture. 본문 텍스트는 임의 작성.
  - 빈 줄: 제로폭 공백(&#x200b;)만 든 문단
  - 이미지 링크: href="#", 실제 주소는 data-linkdata JSON의 link
  - 텍스트 링크: a.se-link[href]
  - 인용(blockquote), 표(se-table)
-->
<html lang="ko">
<body>
<div class="se-viewer se-theme-default">
  <div class="se-component se-documentTitle se-l-default">
    <div class="se-component-content"><div class="se-section se-section-documentTitle se-l-default">
      <div class="se-module se-module-text se-title-text"><p class="se-text-paragraph"><span>테스트용 제목</span></p></div>
    </div></div>
  </div>
  <div class="se-main-container">
    <div class="se-component se-text se-l-default" id="SE-1">
      <div class="se-component-content"><div class="se-section se-section-text se-l-default">
        <div class="se-module se-module-text"><!-- SE-TEXT { -->
          <p class="se-text-paragraph se-text-paragraph-align- " style=""><span class="se-fs- se-ff-   ">&#x200b;</span></p>
          <p class="se-text-paragraph se-text-paragraph-align- "><span class="se-fs- se-ff-   ">첫 번째 문단입니다.</span></p>
          <p class="se-text-paragraph se-text-paragraph-align- "><span class="se-fs- se-ff-   ">자세한 내용은 <a href="https://example.com/profile" class="se-link __se_link" data-linktype="text" data-linkdata='{"id": "SE-2", "link": "https://example.com/profile"}' target="_blank">여기</a>를 참고하세요.</span></p>
          <p class="se-text-paragraph se-text-paragraph-align- "><span class="se-fs- se-ff-   ">&#x200b;</span></p>
        <!-- } SE-TEXT --></div>
      </div></div>
    </div>
    <div class="se-component se-image se-l-default" id="SE-3">
      <div class="se-component-content se-component-content-fit"><div class="se-section se-section-image se-l-default se-section-align-">
        <div class="se-module se-module-image">
          <a href="#" class="se-module-image-link __se_image_link __se_link" onclick="return false;" data-linktype="img" data-linkdata='{"id" : "SE-3", "src" : "https://postfiles.pstatic.net/plain.png", "linkUse" : "false", "link" : ""}'>
            <img src="https://mblogthumb-phinf.pstatic.net/plain.png?type=w800" data-lazy-src="https://mblogthumb-phinf.pstatic.net/plain.png?type=w800" class="se-image-resource">
          </a>
        </div>
      </div></div>
    </div>
    <div class="se-component se-image se-l-default" id="SE-4">
      <div class="se-component-content se-component-content-fit"><div class="se-section se-section-image se-l-default se-section-align-">
        <div class="se-module se-module-image">
          <a href="#" class="se-module-image-link-use se-module-image-link __se_image_link __se_link" onclick="return false;" data-linktype="img" data-linkdata='{"id" : "SE-4", "src" : "https://postfiles.pstatic.net/banner.png", "linkUse" : "true", "link" : "https://link.coupang.com/a/xyz789", "fileSize": "0" }'>
            <img src="https://mblogthumb-phinf.pstatic.net/banner.png?type=w800" class="se-image-resource">
          </a>
        </div>
      </div></div>
    </div>
    <div class="se-component se-quotation se-l-default" id="SE-5">
      <div class="se-component-content"><div class="se-section se-section-quotation se-l-default">
        <blockquote class="se-quotation-container">
          <div class="se-module se-module-text se-quote"><p class="se-text-paragraph"><span><b>인용문 텍스트</b></span></p></div>
        </blockquote>
      </div></div>
    </div>
    <div class="se-component se-table se-l-default" id="SE-6">
      <div class="se-component-content"><div class="se-section se-section-table se-l-default">
        <table class="se-table-content"><tbody><tr>
          <td class="se-cell"><div class="se-module se-module-text"><p class="se-text-paragraph"><span>표 셀 A</span></p></div></td>
          <td class="se-cell"><div class="se-module se-module-text"><p class="se-text-paragraph"><span>표 셀 B</span></p></div></td>
        </tr></tbody></table>
      </div></div>
    </div>
    <div class="se-component se-horizontalLine se-l-default"><hr></div>
  </div>
</div>
</body>
</html>
